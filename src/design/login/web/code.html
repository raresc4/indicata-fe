<style>
    /* Subtle bespoke paper elevation */
    .paper-card {
      box-shadow: 0 4px 20px -2px rgba(30, 30, 30, 0.03), 0 2px 6px -1px rgba(30, 30, 30, 0.02);
    }
    /* Smooth focus rings */
    .focus-ring:focus-within, .focus-ring:focus {
      outline: none;
      border-color: #2b4c7e;
      box-shadow: 0 0 0 3px rgba(43, 76, 126, 0.08);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex flex-col justify-between selection:bg-surface-variant selection:text-on-background font-body-md antialiased">
<!-- TopNavBar (Shared Component) -->
<header class="w-full">
<div class="w-full max-w-5xl mx-auto px-6 py-6 flex justify-between items-center bg-transparent">
<!-- Brand Logo Anchor -->
<a class="flex items-center gap-2.5 group" href="#">
<span class="w-7 h-7 rounded-xl bg-on-background flex items-center justify-center text-surface text-sm transition-transform duration-150 ease-in-out group-hover:scale-95">
<svg fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="15">
<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
<path d="m9 10 2 2 4-4"></path>
</svg>
</span>
<span class="font-headline-sm text-headline-sm text-on-background tracking-tight font-medium">Indicata</span>
</a>
<!-- Secondary Trailing Action: RO / EN Language Switcher -->
<div class="flex items-center text-caption font-caption tracking-normal space-x-1 border border-surface-variant/80 px-2 py-1 rounded-full bg-surface-container-lowest/70 backdrop-blur-sm">
<button class="text-secondary hover:text-primary transition-colors duration-150 px-1.5 py-0.5 rounded" type="button">RO</button>
<span class="text-surface-variant select-none">/</span>
<button class="text-on-background font-medium px-1.5 py-0.5 rounded" type="button">EN</button>
</div>
</div>
</header>
<!-- Main Focus Container -->
<main class="w-full flex-1 flex items-center justify-center px-4 py-8">
<div class="w-full max-w-[430px] bg-surface-container-lowest border border-[#E8E6E1] rounded-xl paper-card p-8 sm:p-10 transition-all duration-150">
<!-- Academic Icon Badge -->
<div class="mb-6 flex justify-between items-center">
<div class="w-10 h-10 rounded-xl bg-surface-container-low border border-[#E8E6E1] flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[20px]" data-icon="account_balance">account_balance</span>
</div>
<span class="font-caption text-caption text-secondary bg-surface-container px-2.5 py-1 rounded-full">QA Workspace</span>
</div>
<!-- Heading & Academic Subtitle -->
<div class="space-y-1.5 mb-8">
<h1 class="font-headline-lg text-headline-lg text-on-background tracking-tight">Sign in</h1>
<p class="font-body-md text-body-md text-secondary leading-relaxed">
          Continue to your institutional evaluation workspace.
        </p>
</div>
<!-- Authentication Form -->
<form action="#" class="space-y-4" method="POST" onsubmit="event.preventDefault();">
<!-- Institutional Email Input -->
<div class="space-y-1.5">
<label class="block font-label-sm text-label-sm text-secondary" for="email">
            Institutional email
          </label>
<div class="relative rounded-lg focus-ring">
<input autocomplete="email" class="w-full bg-surface-container-lowest text-on-background placeholder-[#A8A6A1] text-body-md font-body-md rounded-lg border-[#E8E6E1] py-2.5 px-3.5 focus:border-primary-container focus:ring-0 transition-colors duration-150" id="email" name="email" placeholder="v.popescu@univ.edu.ro" required="" type="email"/>
</div>
</div>
<!-- Password Input with Toggle -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="block font-label-sm text-label-sm text-secondary" for="password">
              Password
            </label>
</div>
<div class="relative rounded-lg focus-ring">
<input autocomplete="current-password" class="w-full bg-surface-container-lowest text-on-background placeholder-[#A8A6A1] text-body-md font-body-md rounded-lg border-[#E8E6E1] py-2.5 pl-3.5 pr-10 focus:border-primary-container focus:ring-0 transition-colors duration-150" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-secondary hover:text-on-background transition-colors duration-150 focus:outline-none" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="visibility" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Utilities Row: Remember me + Forgot password -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input class="w-4 h-4 rounded border-[#D4D1CA] text-primary-container focus:ring-primary-container/20 focus:ring-offset-0 transition-colors" type="checkbox"/>
<span class="font-body-sm text-body-sm text-secondary">Remember me</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container hover:underline transition-colors duration-150" href="#">
            Forgot password?
          </a>
</div>
<!-- Primary Action Button -->
<div class="pt-2">
<button class="w-full h-11 bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md rounded-lg flex items-center justify-center gap-2 transition-colors duration-150 shadow-sm" type="submit">
<span>Sign in</span>
<span class="material-symbols-outlined text-[16px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Low-contrast Divider -->
<div class="relative my-6">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-[#E8E6E1]"></div>
</div>
<div class="relative flex justify-center text-caption font-caption">
<span class="bg-surface-container-lowest px-3 text-secondary">or</span>
</div>
</div>
<!-- Institutional eduID Button -->
<div>
<button class="w-full h-11 bg-surface-container-lowest border border-[#E8E6E1] hover:bg-surface-container-low hover:border-surface-variant text-on-background font-label-md text-label-md rounded-lg flex items-center justify-center gap-2.5 transition-colors duration-150" type="button">
<span class="material-symbols-outlined text-secondary text-[18px]" data-icon="school">school</span>
<span>Continue with institutional account (eduID)</span>
</button>
</div>
<!-- Registration / Create Account Threshold -->
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-secondary">
          Don't have an account? 
          <a class="text-on-background font-medium hover:text-primary hover:underline transition-colors duration-150 ml-0.5" href="#">
            Create an account
          </a>
</p>
</div>
</div>
</main>
<!-- Footer (Shared Component) -->
<footer class="w-full">
<div class="w-full max-w-5xl mx-auto px-6 py-8 flex flex-col sm:flex-row justify-between items-center gap-4 text-center sm:text-left bg-transparent">
<p class="font-caption text-caption text-secondary">
        © Indicata. ARACIS QA Framework compliant.
      </p>
<div class="flex items-center gap-5 text-caption font-caption text-secondary">
<a class="hover:text-primary hover:underline transition-colors duration-150" href="#">Privacy Policy</a>
<span class="text-surface-variant select-none">•</span>
<a class="hover:text-primary hover:underline transition-colors duration-150" href="#">Terms of Service</a>
<span class="text-surface-variant select-none">•</span>
<a class="hover:text-primary hover:underline transition-colors duration-150" href="#">Institutional Access</a>
</div>
</div>
</footer>
<!-- Micro-Interactions Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');

      if (toggleBtn && passwordInput && eyeIcon) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });
      }
    });
  </script>
</body></html>
