@if (state$ | async; as state) {
  <header class="mb-8">
    <h1 class="font-serif text-on-background text-2xl tracking-tight sm:text-3xl" tabindex="-1">
      Review and create
    </h1>
    <p class="text-on-surface-variant mt-1.5 text-sm">
      Check the setup below. Use Edit to change any section before creating the report.
    </p>
  </header>

  <dl
    class="border-outline-variant divide-outline-variant bg-surface-container-lowest divide-y overflow-hidden rounded-xl border"
  >
    @for (row of rowsFor(state); track row.label) {
      <div class="flex items-center justify-between gap-3 px-5 py-3.5 text-sm">
        <dt class="text-on-surface-variant w-1/3 shrink-0">{{ row.label }}</dt>
        <dd class="text-on-surface flex-1 font-medium">{{ row.value }}</dd>
        <button
          class="text-primary hover:underline focus-visible:ring-primary/40 shrink-0 rounded px-1 text-sm font-medium focus-visible:ring-2 focus-visible:outline-none"
          type="button"
          (click)="edit(row.ownerStep)"
        >
          Edit
          <span class="sr-only">{{ row.label }}</span>
        </button>
      </div>
    }
  </dl>

  <div class="mt-8 space-y-1.5">
    <label class="text-on-surface block text-sm font-medium" for="report-name">Report name</label>
    <input
      class="bg-surface-container-lowest text-on-background border-outline-variant focus:border-primary focus:ring-primary/20 placeholder:text-on-surface-variant/60 w-full rounded-lg border px-3.5 py-2.5 transition-colors focus:ring-2 focus:outline-none"
      id="report-name"
      type="text"
      [formControl]="reportName"
    />
  </div>

  @if (errorMessage(); as message) {
    <div
      class="bg-error-container text-on-error-container mt-8 flex items-start gap-2.5 rounded-xl px-4 py-3 text-sm"
      role="alert"
      tabindex="-1"
    >
      <span class="material-symbols-outlined shrink-0 text-[20px] leading-none" aria-hidden="true">
        error
      </span>
      <span>{{ message }}</span>
    </div>
  }

  <div class="border-outline-variant mt-10 flex items-center justify-between border-t pt-6">
    <button
      class="text-on-surface-variant hover:text-on-surface focus-visible:ring-primary/40 flex min-h-11 items-center gap-1.5 rounded-lg px-4 py-2 text-sm font-medium transition-colors focus-visible:ring-2 focus-visible:outline-none disabled:opacity-60"
      type="button"
      [disabled]="creating()"
      (click)="back()"
    >
      <span class="material-symbols-outlined text-[18px]" aria-hidden="true">arrow_back</span>
      <span>Back</span>
    </button>
    <button
      class="bg-primary text-on-primary hover:bg-primary-container focus-visible:ring-primary/40 flex min-h-11 items-center justify-center gap-2 rounded-lg px-5 py-2.5 text-sm font-medium shadow-sm transition-colors focus-visible:ring-2 focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-60"
      type="button"
      [disabled]="creating()"
      [attr.aria-busy]="creating()"
      (click)="create()"
    >
      @if (creating()) {
        <span class="material-symbols-outlined animate-spin text-[18px]" aria-hidden="true"
          >progress_activity</span
        >
        <span>Creating…</span>
      } @else {
        <span>Create report</span>
        <span class="material-symbols-outlined text-[18px]" aria-hidden="true">arrow_forward</span>
      }
    </button>
  </div>
}
