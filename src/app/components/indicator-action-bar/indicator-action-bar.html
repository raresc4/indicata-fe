@if (nav$ | async; as nav) {
  <div class="flex items-center gap-2">
    <button
      type="button"
      class="text-on-surface bg-surface-container-low border-outline-variant hover:bg-surface-container focus-visible:ring-primary/50 focus-visible:ring-offset-surface inline-flex items-center gap-1.5 rounded-md border px-3 py-1.5 text-xs font-medium transition focus-visible:ring-2 focus-visible:ring-offset-1 focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-40"
      [disabled]="nav.prevCode === null"
      (click)="state.goPrev()"
    >
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m12 19-7-7 7-7" />
        <path d="M19 12H5" />
      </svg>
      Previous
    </button>

    <span class="text-on-surface-variant px-1 font-mono text-xs" aria-live="polite">
      {{ nav.position }} / {{ nav.total }}
    </span>

    <button
      type="button"
      class="text-on-surface bg-surface-container-low border-outline-variant hover:bg-surface-container focus-visible:ring-primary/50 focus-visible:ring-offset-surface inline-flex items-center gap-1.5 rounded-md border px-3 py-1.5 text-xs font-medium transition focus-visible:ring-2 focus-visible:ring-offset-1 focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-40"
      [disabled]="nav.nextCode === null"
      (click)="state.goNext()"
    >
      @if (nav.nextCode !== null) {
        Next ({{ nav.nextCode }})
      } @else {
        Next
      }
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M5 12h14" />
        <path d="m12 5 7 7-7 7" />
      </svg>
    </button>
  </div>
}
