<div class="flex items-center gap-2.5">
  <span
    class="text-on-surface bg-surface-container-low border-outline-variant rounded border px-2 py-0.5 font-mono text-xs font-bold"
  >
    {{ code() }}
  </span>
  @if (currentVersionLabel$ | async; as versionLabel) {
    <span
      class="text-on-surface bg-surface-container-low border-outline-variant rounded border px-2 py-0.5 font-mono text-xs font-bold"
    >
      {{ versionLabel }}
    </span>
  }
  <span
    class="inline-flex items-center gap-1.5 rounded-full border px-2.5 py-0.5 text-xs font-medium {{
      badge().classes
    }}"
  >
    @if (badge().spinning) {
      <svg
        width="12"
        height="12"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        class="animate-spin"
      >
        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
      </svg>
    }
    {{ badge().label }}
  </span>
</div>

<div class="flex items-center gap-2">
  <span class="text-on-surface-variant mr-1 flex items-center gap-1.5 text-xs" aria-live="polite">
    @switch (saveStatus$ | async) {
      @case ('saving') {
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          class="animate-spin"
        >
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
        <span>Saving…</span>
      }
      @case ('saved') {
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          class="text-success"
        >
          <path d="M20 6 9 17l-5-5" />
        </svg>
        <span>Saved</span>
      }
      @case ('error') {
        <span class="text-error">Save failed</span>
      }
    }
  </span>

  <button
    type="button"
    class="bg-primary text-on-primary hover:bg-primary/90 focus-visible:ring-primary/50 focus-visible:ring-offset-surface inline-flex items-center gap-1.5 rounded-md px-3.5 py-1.5 text-xs font-semibold transition focus-visible:ring-2 focus-visible:ring-offset-1 focus-visible:outline-none"
    (click)="onGenerate()"
  >
    <svg
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path
        d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"
      />
      <path d="M20 2v4" />
      <path d="M22 4h-4" />
    </svg>
    Generate
  </button>

  <button
    type="button"
    class="text-on-surface bg-surface-container-low border-outline-variant hover:bg-surface-container focus-visible:ring-primary/50 focus-visible:ring-offset-surface inline-flex items-center gap-1.5 rounded-md border px-3 py-1.5 text-xs font-medium transition focus-visible:ring-2 focus-visible:ring-offset-1 focus-visible:outline-none"
    (click)="onMarkReviewed()"
  >
    <svg
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M18 6 7 17l-5-5" />
      <path d="m22 10-7.5 7.5L13 16" />
    </svg>
    Mark as reviewed
  </button>
</div>
