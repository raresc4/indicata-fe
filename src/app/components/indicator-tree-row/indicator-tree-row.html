<span class="mt-1 h-2 w-2 shrink-0 rounded-full {{ presentation().dot }}" aria-hidden="true">
</span>
<span class="min-w-0 flex-1">
  <span class="flex items-center justify-between gap-2">
    <span class="font-mono text-[11px] font-semibold">{{ code() }}</span>
    <span class="shrink-0 font-mono text-[10px] font-medium {{ presentation().badge }}">
      {{ presentation().label }}
    </span>
  </span>
  <span class="mt-0.5 block truncate text-[11px] leading-snug">{{ title() }}</span>
</span>
